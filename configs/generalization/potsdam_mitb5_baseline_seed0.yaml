method: baseline
seed: 0
output_dir: outputs/b5_generalization/potsdam_mitb5_baseline_seed0
dataset:
  name: potsdam
  root: data/potsdam
  image_dir: processed_multiclass/images
  label_dir: processed_multiclass/labels
  num_classes: 6
  ignore_index: 255
  crop_size: 512
model:
  backbone: nvidia/mit-b5
  fuse_dim: 256
  residual_scale: 0.15
  delta_hidden_dims: []
training:
  batch_size: 8
  val_batch_size: 1
  num_workers: 4
  lr: 6.0e-05
  weight_decay: 0.01
  amp: true
  max_iters: 80000
  warmup_iters: 1500
  lr_scheduler: poly
  warmup_start_factor: 1.0e-06
  poly_power: 1.0
  topk_start_iter: 1500
  val_interval: 1000
  log_interval: 50
loss:
  lambda_dice: 1.0
  lambda_local: 0.1
  lambda_boundary: 0.05
  lambda_hard: 0.4
  topk_ratio: 0.05
  local_sigmas:
  - 1.0
  - 3.0
  - 5.0
  local_weights:
  - 0.5
  - 0.3
  - 0.2
  boundary_width: 3
  boundary_margin: 0.18
