[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sufh-rl"
version = "0.1.0"
description = "Spatially Aware Uncertainty Feedback for Hard-Region Remote Sensing Semantic Segmentation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["sufh_rl*"]
